<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
<title id="title">Gas quantity from pressure change</title>
<desc id="desc">A 24 litre configuration starts at 225 bar, or 5400 reference litres. A 50 bar drop uses 1200 reference litres. The remaining 175 bar corresponds to 4200 reference litres. Ideal-gas classroom approximation at one bar reference.</desc>
<rect width="720" height="250" fill="#f8fafc"/>
<text x="24" y="35" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#172b4d">24 L configuration: 225 bar start</text>
<text x="24" y="60" font-family="Arial,sans-serif" font-size="15" fill="#334155">Starting quantity = 24 × 225 = 5,400 reference L</text>
<rect x="24" y="90" width="672" height="68" rx="5" fill="#e2e8f0"/>
<rect x="24" y="90" width="149.33" height="68" rx="5" fill="#a64b3c"/>
<rect x="173.33" y="90" width="522.67" height="68" rx="5" fill="#147d79"/>
<line x1="173.33" y1="90" x2="173.33" y2="158" stroke="#ffffff" stroke-width="2"/>
<text x="98" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Used</text>
<text x="98" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#ffffff">50 bar</text>
<text x="434" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Remaining</text>
<text x="434" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#ffffff">175 bar</text>
<text x="24" y="188" font-family="Arial,sans-serif" font-size="15" fill="#172b4d">Used: 24 × 50 = 1,200 reference L</text>
<text x="380" y="188" font-family="Arial,sans-serif" font-size="15" fill="#172b4d">Remaining: 24 × 175 = 4,200 reference L</text>
<text x="24" y="225" font-family="Arial,sans-serif" font-size="13" fill="#475569">Classroom approximation: comparable temperature, ideal-gas model, 1 bar reference.</text>
</svg>